<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>post-quote</title>
<link rel="stylesheet" href="/templates/shared/base.css">
<style>
  :root { --bg1: #120f2b; --bg2: #2b1f5c; --accent: #ff5c8a; --accent2: #7c5cff; --text: #ffffff; }
  body { width: 1080px; height: 1350px; color: var(--text); position: relative;
         background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%); overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .5; }
  #b1 { width: 800px; height: 800px; background: var(--accent); top: -380px; right: -300px; }
  #b2 { width: 900px; height: 900px; background: var(--accent2); bottom: -520px; left: -380px; }
  #card { position: absolute; inset: 100px 96px; display: flex; flex-direction: column; }
  .kicker { align-self: flex-start; font-size: 30px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
            padding: 14px 26px; border-radius: 999px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.25); }
  .mark { font-size: 280px; font-weight: 900; line-height: .7; color: var(--accent); margin-top: 90px; height: 150px; }
  .title { font-size: 92px; font-weight: 900; line-height: 1.04; letter-spacing: -0.035em; }
  .title .accent { color: var(--accent); }
  .body { margin-top: 40px; font-size: 42px; font-weight: 500; line-height: 1.35; opacity: .82; }
  .footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 32px; font-weight: 600; opacity: .9; }
  .footer .save { padding: 14px 28px; border-radius: 999px; background: var(--accent); color: var(--bg1); font-weight: 800; }
</style>
</head>
<body>
<div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="card"></div>
<script type="module">
import { markupWords } from '/templates/shared/anim.js';
const spec = window.__SPEC__ ?? { kicker: 'Podgląd', title: 'Szablon *posta*', body: 'Tekst pomocniczy.', brand: { handle: '@twojamarka' } };
const brand = spec.brand ?? {};
for (const k of ['bg1', 'bg2', 'accent', 'accent2', 'text']) if (brand[k]) document.documentElement.style.setProperty('--' + k, brand[k]);
const words = (t) => markupWords(t).map((w) => (w.accent ? `<span class="accent">${w.html}</span>` : w.html)).join(' ');
const esc = (s = '') => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
document.getElementById('card').innerHTML = `
  ${spec.kicker ? `<div class="kicker">${esc(spec.kicker)}</div>` : ''}
  <div class="mark">“</div>
  <div class="title">${words(spec.title)}</div>
  ${spec.body ? `<div class="body">${words(spec.body)}</div>` : ''}
  <div class="footer"><span>${esc(brand.handle)}</span>${spec.footer ? `<span class="save">${esc(spec.footer)}</span>` : ''}</div>`;
window.__DURATION__ = 0;
window.__renderFrame = () => {};
await document.fonts.ready;
window.__READY__ = true;
</script>
</body>
</html>
